    <path d="M34,40 h10 M62,34 h12 M90,32 h8 M50,42 h6 M78,40 h8"/>
  </g>
  <!-- Straw on the side -->
  <g stroke="#9E6A17" stroke-width="2" stroke-linecap="round" opacity=".7">
