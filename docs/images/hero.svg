  <text class="chipt" x="530" y="202" font-size="13.5" font-weight="600" text-anchor="middle">bale idle builds</text>
  <rect class="chip" x="612" y="180" width="160" height="34" rx="17"/>
  <text class="chipt" x="692" y="202" font-size="13.5" font-weight="600" text-anchor="middle">park old worktrees</text>
