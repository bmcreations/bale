<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 412" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="bale's worktree lifecycle: hot, stashed, baled and cold, and how each comes back to hot">
  <style>
    .fg { fill: #1f2328; }
    .mute { fill: #59636e; }
    .line { stroke: #8c959f; }
    .back { stroke: #0969da; }
    .backt { fill: #0969da; }
    .box { stroke-width: 1.5; }
    .hot { fill: #ffebe9; stroke: #cf222e; }
    .warm { fill: #fff8c5; stroke: #bf8700; }
    .baled { fill: #ddf4ff; stroke: #0969da; }
    .cold { fill: #eaeef2; stroke: #6e7781; }
    .lane { fill: #f6f8fa; stroke: #d1d9e0; }
    @media (prefers-color-scheme: dark) {
      .fg { fill: #e6edf3; }
      .mute { fill: #9198a1; }
      .line { stroke: #6e7681; }
      .back { stroke: #4493f8; }
      .backt { fill: #4493f8; }
      .hot { fill: #3c1618; stroke: #f85149; }
      .warm { fill: #3a2d0b; stroke: #d29922; }
      .baled { fill: #0c2d4a; stroke: #4493f8; }
      .cold { fill: #21262d; stroke: #8b949e; }
      .lane { fill: #161b22; stroke: #30363d; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4493f8"/>
    </marker>
  </defs>

  <!-- Agent hooks lane -->
  <rect class="lane" x="20" y="16" width="860" height="58" rx="10"/>
  <text class="fg" x="40" y="40" font-size="14" font-weight="600">Agent tools call bale from their hooks: new worktree, prompt, tool call, turn end</text>
  <text class="mute" x="40" y="60" font-size="12.5">Claude Code · Codex · Cursor · Conductor · T3 Code · git post-checkout</text>
  <line class="back" x1="105" y1="76" x2="105" y2="132" stroke-width="2" marker-end="url(#b)"/>
  <text class="backt" x="115" y="108" font-size="12">registers the tree, marks it active</text>
  <text class="mute" x="880" y="108" font-size="12" text-anchor="end">bale sweep moves idle trees right, every 5 minutes</text>

  <!-- Tiers -->
  <rect class="box hot" x="20" y="136" width="170" height="124" rx="10"/>
  <text class="fg" x="38" y="164" font-size="17" font-weight="700">Hot</text>
  <text class="fg" x="38" y="190" font-size="12.5">The agent is working.</text>
  <text class="fg" x="38" y="209" font-size="12.5">Checkout and build</text>
  <text class="fg" x="38" y="228" font-size="12.5">output on disk.</text>

  <rect class="box warm" x="250" y="136" width="170" height="124" rx="10"/>
  <text class="fg" x="268" y="164" font-size="17" font-weight="700">Stashed</text>
  <text class="fg" x="268" y="190" font-size="12.5">Large build files</text>
  <text class="fg" x="268" y="209" font-size="12.5">compressed into the</text>
  <text class="fg" x="268" y="228" font-size="12.5">store, emptied in place.</text>
  <text class="mute" x="268" y="248" font-size="11.5">Claude Code trees</text>

  <rect class="box baled" x="480" y="136" width="170" height="124" rx="10"/>
  <text class="fg" x="498" y="164" font-size="17" font-weight="700">Baled</text>
  <text class="fg" x="498" y="190" font-size="12.5">Build output removed.</text>
  <text class="fg" x="498" y="209" font-size="12.5">Source and git state</text>
  <text class="fg" x="498" y="228" font-size="12.5">untouched.</text>

  <rect class="box cold" x="710" y="136" width="170" height="124" rx="10"/>
  <text class="fg" x="728" y="164" font-size="17" font-weight="700">Cold</text>
  <text class="fg" x="728" y="190" font-size="12.5">Uncommitted work and</text>
  <text class="fg" x="728" y="209" font-size="12.5">ignored files saved,</text>
  <text class="fg" x="728" y="228" font-size="12.5">checkout deleted.</text>

  <!-- Forward arrows (sweep) -->
  <line class="line" x1="192" y1="198" x2="248" y2="198" stroke-width="2" marker-end="url(#a)"/>
  <line class="line" x1="422" y1="198" x2="478" y2="198" stroke-width="2" marker-end="url(#a)"/>
  <line class="line" x1="652" y1="198" x2="708" y2="198" stroke-width="2" marker-end="url(#a)"/>
  <text class="mute" x="220" y="186" font-size="11.5" text-anchor="middle">10 min</text>
  <text class="mute" x="450" y="186" font-size="11.5" text-anchor="middle">4 h</text>
  <text class="mute" x="680" y="186" font-size="11.5" text-anchor="middle">7 days</text>
  <text class="mute" x="220" y="216" font-size="11.5" text-anchor="middle">idle</text>
  <text class="mute" x="450" y="216" font-size="11.5" text-anchor="middle">idle</text>
  <text class="mute" x="680" y="216" font-size="11.5" text-anchor="middle">idle</text>

  <!-- Return paths -->
  <polyline class="back" points="335,262 335,300 150,300 150,264" fill="none" stroke-width="2" marker-end="url(#b)"/>
  <text class="backt" x="170" y="318" font-size="12.5">next prompt restores it in place; nothing relinks</text>

  <polyline class="back" points="565,262 565,340 105,340 105,264" fill="none" stroke-width="2" marker-end="url(#b)"/>
  <text class="backt" x="170" y="358" font-size="12.5">next build regenerates it</text>

  <polyline class="back" points="795,262 795,380 60,380 60,264" fill="none" stroke-width="2" marker-end="url(#b)"/>
  <text class="backt" x="170" y="398" font-size="12.5">bale open restores it at the same path</text>
</svg>
