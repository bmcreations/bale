<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="bale: keep agent worktrees from filling your disk">
  <style>
    .bg { fill: #fff8e7; stroke: #f0dcae; }
    .title { fill: #1f2328; }
    .tag { fill: #4b5563; }
    .chip { fill: #ffffff; stroke: #e8cf94; }
    .chipt { fill: #6b4e16; }
