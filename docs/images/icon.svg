    <path d="M22,56 h10 M50,54 h8 M70,58 h12 M24,70 h8 M56,68 h10 M76,72 h6 M20,84 h12 M48,82 h8 M68,86 h12 M26,96 h8 M54,94 h10 M76,98 h6"/>
