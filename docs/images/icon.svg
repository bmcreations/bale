<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="bale icon: a hay bale tied with two bands of twine">
  <!-- Shadow -->
  <ellipse cx="66" cy="112" rx="50" ry="6" fill="#000" opacity=".12"/>
  <!-- Top face -->
  <path d="M16,46 L42,26 L114,26 L88,46 Z" fill="#F6D77E" stroke="#F6D77E" stroke-width="6" stroke-linejoin="round"/>
  <!-- Side face -->
  <path d="M88,46 L114,26 L114,84 L88,104 Z" fill="#C9902B" stroke="#C9902B" stroke-width="6" stroke-linejoin="round"/>
  <!-- Front face -->
  <path d="M16,46 L88,46 L88,104 L16,104 Z" fill="#E8B13F" stroke="#E8B13F" stroke-width="6" stroke-linejoin="round"/>
  <!-- Straw on the front -->
